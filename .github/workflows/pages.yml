name: Publish share page

# Deploys sharepage/ (the shared bot-immune confirm page) to GitHub Pages.
# The page is trusted code for every installation that points share_page_url
# at it (facit E7.S5) — changes to sharepage/ deserve the same scrutiny as code.

on:
  push:
    branches: [main]
    paths:
      - "sharepage/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sharepage
      - id: deployment
        uses: actions/deploy-pages@v4
