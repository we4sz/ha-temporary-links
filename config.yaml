name: "Temporary Links"
version: "1.1.0"
slug: "temporary_links"
description: "Generate temporary links that trigger Home Assistant actions - time-boxed, usage-limited, shareable via SMS or copy"
url: "https://github.com/we4sz/ha-temporary-links"
arch:
  - amd64
  - aarch64
  - armv7

startup: application
boot: auto

ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:link-variant
panel_title: "Temporary Links"


map:
  - data:rw
  - homeassistant_config:rw

options:
  twilio_account_sid: ""
  twilio_auth_token: ""
  twilio_phone_number: ""
  default_message_template: "Your temporary access link: {link}\nValid from {start_time} to {end_time}"
  ha_url: ""
  ha_token: ""
  public_url: ""
  share_page_url: ""
  log_level: "Information"

schema:
  twilio_account_sid: str
  twilio_auth_token: password
  twilio_phone_number: str
  default_message_template: str
  ha_url: str
  ha_token: password
  public_url: str?
  share_page_url: str?
  log_level: list(Trace|Debug|Information|Warning|Error|Critical)
